<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Streamer.bot Shoutout Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@500;700;900&family=Rajdhani:wght@600;700&family=Bebas+Neue&family=Montserrat:wght@600;800;900&family=Russo+One&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #9146ff;
    --secondary: #00f0ff;
    --accent: #ff007f;
    --alert-border-color: #9146ff;
    --alert-bg-1: rgba(14, 14, 24, 0.94);
    --alert-bg-2: rgba(26, 20, 45, 0.94);
    --title-color: #00f0ff;
    --username-color: #ffffff;
    --game-color: #00f0ff;
    --text-color: #ffffff;
    --font-main: 'Outfit', sans-serif;
    --border-thickness: 6px;
    --border-radius: 18px;
    --alert-border-thickness: 3px;
    --alert-border-radius: 50px;
    --title-size: 15px;
    --username-size: 40px;
    --game-size: 14px;
    --avatar-size: 92px;
    --glow-size: 22px;
    --player-width: 720px;
    --edge-margin: 48px;
    --ring-display: block;
    --progress-display: block;
    --name-transform: none;
    --custom-shadow: 0 14px 40px rgba(0,0,0,0.65), 0 0 var(--glow-size) var(--primary);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    font-family: var(--font-main);
    color: var(--text-color);
    user-select: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: var(--edge-margin) var(--edge-margin) calc(var(--edge-margin) + 16px) var(--edge-margin);
  }
  #stage.pos-center { align-items: center; justify-content: center; }
  #stage.pos-bottom-left { align-items: flex-end; justify-content: flex-start; }
  #stage.pos-bottom-right { align-items: flex-end; justify-content: flex-end; }
  #stage.pos-top-left { align-items: flex-start; justify-content: flex-start; }
  #stage.pos-top-right { align-items: flex-start; justify-content: flex-end; }
  #stage.pos-top-center { align-items: flex-start; justify-content: center; }
  #stage.pos-bottom-center { align-items: flex-end; justify-content: center; }

  /* ==================== PHASE 1: ALERT CARD ==================== */
  #alert-container {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 18px 34px 18px 20px;
    max-width: calc(100vw - (var(--edge-margin) * 2));
    border-radius: var(--alert-border-radius);
    background: linear-gradient(135deg, var(--alert-bg-1), var(--alert-bg-2));
    border: var(--alert-border-thickness) solid var(--alert-border-color);
    box-shadow: var(--custom-shadow);
    opacity: 0;
    pointer-events: none;
    transform: var(--fx-in-transform, scale(0.75) translateY(35px));
    filter: var(--fx-in-filter, blur(0px));
    transition: opacity var(--fx-dur, 0.48s) var(--fx-ease, cubic-bezier(0.16, 1, 0.3, 1)),
                transform var(--fx-dur, 0.48s) var(--fx-ease, cubic-bezier(0.16, 1, 0.3, 1)),
                filter var(--fx-dur, 0.48s) ease;
    z-index: 20;
    overflow: hidden;
    will-change: transform, opacity, filter;
    backface-visibility: hidden;
  }
  /* Keep Alert Container strictly anchored inside screen edges for every position */
  #stage.pos-bottom-left #alert-container { left: var(--edge-margin); bottom: calc(var(--edge-margin) + 8px); }
  #stage.pos-bottom-right #alert-container { right: var(--edge-margin); bottom: calc(var(--edge-margin) + 8px); }
  #stage.pos-top-left #alert-container { left: var(--edge-margin); top: var(--edge-margin); }
  #stage.pos-top-right #alert-container { right: var(--edge-margin); top: var(--edge-margin); }
  #stage.pos-top-center #alert-container { top: var(--edge-margin); }
  #stage.pos-bottom-center #alert-container { bottom: calc(var(--edge-margin) + 8px); }

  #alert-container.active {
    opacity: 1;
    transform: scale(1) translate(0, 0) rotate(0deg) skew(0deg);
    filter: blur(0px);
  }
  #alert-container.exit {
    opacity: 0;
    transform: var(--fx-out-transform, scale(0.85) translateY(-30px));
    filter: var(--fx-out-filter, blur(0px));
  }

  .alert-avatar-wrap {
    position: relative;
    width: var(--avatar-size);
    height: var(--avatar-size);
    flex-shrink: 0;
  }
  .alert-avatar-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    display: var(--ring-display);
    background: conic-gradient(from 0deg, var(--primary), var(--secondary), var(--accent), var(--primary));
    animation: spinSlow 3s linear infinite;
  }
  .alert-avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #0d0d15;
    background: #181824;
    z-index: 2;
  }
  .platform-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
    color: #fff;
    border: 2px solid #0d0d15;
    z-index: 3;
    text-transform: uppercase;
    letter-spacing: -0.3px;
  }
  .platform-twitch { background: #9146ff; }
  .platform-kick { background: #53fc18; color: #000; }
  .platform-youtube { background: #ff0033; }

  .alert-text-wrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    flex: 1;
    overflow: hidden;
  }
  .alert-label {
    font-size: var(--title-size);
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--title-color);
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .alert-username {
    font-size: var(--username-size);
    font-weight: 900;
    line-height: 1.08;
    color: var(--username-color);
    text-transform: var(--name-transform);
    text-shadow: 0 3px 15px rgba(0,0,0,0.7), 0 0 18px var(--primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .alert-sub {
    font-size: var(--game-size);
    color: var(--game-color);
    opacity: 0.92;
    margin-top: 3px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .alert-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 4px;
    width: 100%;
    display: var(--progress-display);
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    transform-origin: left center;
  }

  /* ==================== PHASE 2: CLIP + BORDER ENGINE ==================== */
  #clip-wrapper {
    position: relative;
    width: var(--player-width);
    max-width: calc(100vw - (var(--edge-margin) * 2));
    max-height: calc(100vh - (var(--edge-margin) * 2) - 24px);
    aspect-ratio: 16 / 9;
    opacity: 0;
    pointer-events: none;
    transform: var(--fx-in-transform, scale(0.82) translateY(30px));
    filter: var(--fx-in-filter, blur(0px));
    transition: opacity var(--fx-dur, 0.5s) var(--fx-ease, cubic-bezier(0.16, 1, 0.3, 1)),
                transform var(--fx-dur, 0.5s) var(--fx-ease, cubic-bezier(0.16, 1, 0.3, 1)),
                filter var(--fx-dur, 0.5s) ease;
    z-index: 10;
    will-change: transform, opacity, filter;
    backface-visibility: hidden;
  }
  #clip-wrapper.active {
    opacity: 1;
    transform: scale(1) translate(0, 0) rotate(0deg) skew(0deg);
    filter: blur(0px);
  }
  #clip-wrapper.exit {
    opacity: 0;
    transform: var(--fx-out-transform, scale(0.88) translateY(25px));
    filter: var(--fx-out-filter, blur(0px));
  }

  #custom-border-shell {
    position: absolute;
    inset: calc(var(--border-thickness) * -1);
    border-radius: calc(var(--border-radius) + var(--border-thickness));
    pointer-events: none;
    z-index: 1;
  }

  #custom-border-decor {
    position: absolute;
    inset: calc(var(--border-thickness) * -1.6);
    pointer-events: none;
    z-index: 4;
  }

  #video-box {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: var(--border-radius);
    overflow: hidden;
    background: #07070c;
    z-index: 2;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #clip-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: none;
    display: block;
  }
  #no-clip-fallback {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 24px;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(145,70,255,0.22), #07070c 75%);
  }
  #no-clip-fallback img {
    width: var(--avatar-size);
    height: var(--avatar-size);
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--secondary);
    box-shadow: 0 0 20px var(--primary);
  }

  /* ==================== CLIP BANNER (long names never clip off-screen) ==================== */
  #clip-banner {
    position: absolute;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 12px);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 22px 8px 10px;
    border-radius: var(--alert-border-radius);
    background: linear-gradient(135deg, var(--alert-bg-1), var(--alert-bg-2));
    border: var(--alert-border-thickness) solid var(--alert-border-color);
    box-shadow: var(--custom-shadow);
    z-index: 6;
    white-space: nowrap;
    overflow: hidden;
  }
  #clip-banner img {
    width: calc(var(--avatar-size) * 0.42);
    height: calc(var(--avatar-size) * 0.42);
    min-width: 28px;
    min-height: 28px;
    max-width: 58px;
    max-height: 58px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--secondary);
    flex-shrink: 0;
  }
  #clip-banner .banner-name {
    font-size: calc(var(--username-size) * 0.52);
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--username-color);
    text-transform: var(--name-transform);
    text-shadow: 0 0 10px var(--primary);
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex-shrink: 1;
  }
  #clip-banner .banner-game {
    font-size: var(--game-size);
    font-weight: 700;
    color: var(--game-color);
    text-transform: uppercase;
    padding-left: 8px;
    border-left: 1px solid rgba(255,255,255,0.25);
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex-shrink: 1;
  }

  #clip-timer-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 5px;
    width: 100%;
    display: var(--progress-display);
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    z-index: 5;
    transform-origin: left center;
  }

  /* ==================== BORDER DECOR HELPERS ==================== */
  .fx-shine {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 38%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shineSweep 3.8s ease-in-out infinite;
  }
  .fx-dash { animation: dashFlow 3s linear infinite; }
  .fx-dash-rev { animation: dashFlow 4.2s linear infinite reverse; }

  /* ==================== KEYFRAMES ==================== */
  @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes pulseGlow {
    0%, 100% { filter: drop-shadow(0 0 var(--glow-size) var(--b-c1)) brightness(1); }
    50% { filter: drop-shadow(0 0 calc(var(--glow-size) * 1.7) var(--b-c2)) brightness(1.25); }
  }
  @keyframes glitchShake {
    0%, 92%, 100% { transform: translate(0, 0); }
    94% { transform: translate(-3px, 2px); }
    96% { transform: translate(3px, -2px); }
    98% { transform: translate(-2px, -1px); }
  }
  @keyframes scanlineMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 40px; }
  }
  @keyframes countdownLinear {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }
  @keyframes shineSweep {
    0% { transform: translateX(-140%) skewX(-18deg); }
    55%, 100% { transform: translateX(300%) skewX(-18deg); }
  }
  @keyframes dashFlow { to { stroke-dashoffset: -400; } }
  @keyframes hueSpin {
    0% { filter: hue-rotate(0deg) drop-shadow(0 0 var(--glow-size) var(--b-c1)); }
    100% { filter: hue-rotate(360deg) drop-shadow(0 0 var(--glow-size) var(--b-c1)); }
  }
  @keyframes flickerGlow {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 var(--glow-size) var(--b-c1)); }
    42% { filter: brightness(1.28) drop-shadow(0 0 calc(var(--glow-size) * 1.8) var(--b-c2)); }
    58% { filter: brightness(0.9) drop-shadow(0 0 calc(var(--glow-size) * 0.6) var(--b-c1)); }
    76% { filter: brightness(1.18) drop-shadow(0 0 calc(var(--glow-size) * 1.4) var(--b-c3)); }
  }
  @keyframes auraConduit {
    0%, 100% { box-shadow: var(--custom-shadow), 0 0 calc(var(--glow-size) * 0.8) var(--primary); }
    50% { box-shadow: var(--custom-shadow), 0 0 calc(var(--glow-size) * 1.8) var(--secondary), inset 0 0 18px var(--accent); }
  }
  @keyframes auraHeartbeat {
    0%, 100% { filter: drop-shadow(0 0 calc(var(--glow-size) * 0.5) var(--primary)); }
    20% { filter: drop-shadow(0 0 calc(var(--glow-size) * 1.6) var(--secondary)) brightness(1.18); }
    40% { filter: drop-shadow(0 0 calc(var(--glow-size) * 0.7) var(--primary)); }
    60% { filter: drop-shadow(0 0 calc(var(--glow-size) * 1.9) var(--accent)) brightness(1.22); }
  }
  @keyframes auraChroma {
    0% { filter: hue-rotate(0deg) drop-shadow(0 0 var(--glow-size) var(--primary)); }
    100% { filter: hue-rotate(360deg) drop-shadow(0 0 var(--glow-size) var(--secondary)); }
  }
  @keyframes auraTide {
    0%, 100% { box-shadow: var(--custom-shadow); filter: saturate(1); }
    35% { box-shadow: var(--custom-shadow), 0 0 calc(var(--glow-size) * 1.5) var(--secondary); filter: saturate(1.2); }
    70% { box-shadow: var(--custom-shadow), 0 0 calc(var(--glow-size) * 1.1) var(--accent); filter: saturate(1.08); }
  }
  @keyframes auraRing {
    0%, 100% { box-shadow: var(--custom-shadow), 0 0 0 0 var(--secondary); }
    55% { box-shadow: var(--custom-shadow), 0 0 0 7px rgba(255,255,255,0); }
  }
  @keyframes auraSweep {
    0% { box-shadow: var(--custom-shadow), -14px 0 22px -10px var(--secondary); }
    50% { box-shadow: var(--custom-shadow), 14px 0 22px -10px var(--secondary); }
    100% { box-shadow: var(--custom-shadow), -14px 0 22px -10px var(--secondary); }
  }
  @keyframes auraFlicker {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 calc(var(--glow-size) * 0.8) var(--primary)); }
    30% { filter: brightness(1.22) drop-shadow(0 0 calc(var(--glow-size) * 1.5) var(--accent)); }
    44% { filter: brightness(0.94) drop-shadow(0 0 calc(var(--glow-size) * 0.5) var(--primary)); }
    72% { filter: brightness(1.14) drop-shadow(0 0 calc(var(--glow-size) * 1.3) var(--secondary)); }
  }
  @keyframes auraStrobe {
    0%, 100% { box-shadow: var(--custom-shadow); }
    46% { box-shadow: var(--custom-shadow); }
    50% { box-shadow: var(--custom-shadow), 0 0 calc(var(--glow-size) * 2.2) var(--secondary), inset 0 0 20px var(--secondary); }
    56% { box-shadow: var(--custom-shadow); }
  }
</style>
</head>
<body>

<div id="stage" class="pos-center">
  <!-- PHASE 1: SHOUTOUT ALERT -->
  <div id="alert-container">
    <div class="alert-avatar-wrap">
      <div class="alert-avatar-ring"></div>
      <img id="alert-avatar" class="alert-avatar" src="" alt="Avatar" />
      <div id="alert-platform" class="platform-badge platform-twitch">TW</div>
    </div>
    <div class="alert-text-wrap">
      <div id="alert-prefix" class="alert-label">SHOUTOUT TO</div>
      <div id="alert-username" class="alert-username">Username</div>
      <div id="alert-sub" class="alert-sub">Check out their channel!</div>
    </div>
    <div id="alert-progress" class="alert-progress"></div>
  </div>

  <!-- PHASE 2: CUSTOM BORDER + CLIP (Twitch or Kick) -->
  <div id="clip-wrapper">
    <div id="custom-border-shell"></div>
    <div id="custom-border-decor"></div>
    <div id="video-box">
      <video id="clip-video" playsinline></video>
      <div id="no-clip-fallback">
        <img id="fallback-avatar" src="" alt="Avatar" />
        <div id="fallback-title" style="font-size:26px; font-weight:900;">Username</div>
        <div id="fallback-msg" style="font-size:14px; color:var(--secondary);">twitch.tv/username</div>
      </div>
      <div id="clip-timer-bar"></div>
    </div>
    <div id="clip-banner">
      <img id="banner-avatar" src="" alt="Avatar" />
      <span id="banner-name" class="banner-name">Username</span>
      <span id="banner-game" class="banner-game">Just Chatting</span>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   PRESET CATALOG
   IDs 1-120 in every library keep their original style mapping, so any look
   saved before this update resolves to exactly the same thing.
   New styles are appended starting at ID 121.
   ========================================================================== */

const TWITCH_CHAT_PALETTE = [
  "#9146FF", "#0000FF", "#FF7F50", "#1E90FF", "#00FF7F",
  "#9ACD32", "#008000", "#FF4500", "#FF0000", "#DAA520",
  "#FF69B4", "#5F9EA0", "#2E8B57", "#D2691E", "#8A2BE2", "#B22222"
];

const BORDER_PALETTES = [
  { name: "Twitch Neon", c1: "#9146ff", c2: "#00f0ff", c3: "#ff007f" },
  { name: "Cyberpunk 2077", c1: "#fcee0a", c2: "#00f0ff", c3: "#ff003c" },
  { name: "Inferno Blaze", c1: "#ff2a00", c2: "#ff9900", c3: "#ffee00" },
  { name: "Arctic Frost", c1: "#00d2ff", c2: "#3a7bd5", c3: "#e0ffff" },
  { name: "Toxic Venom", c1: "#53fc18", c2: "#00b09b", c3: "#111111" },
  { name: "Royal Gold", c1: "#ffd700", c2: "#b8860b", c3: "#fff8dc" },
  { name: "Blood Moon", c1: "#ff0033", c2: "#660011", c3: "#ff6680" },
  { name: "Synthwave Sunset", c1: "#ff00aa", c2: "#7700ff", c3: "#00ffff" },
  { name: "Matrix Code", c1: "#00ff41", c2: "#008f11", c3: "#003b00" },
  { name: "Obsidian Stealth", c1: "#2c3e50", c2: "#bdc3c7", c3: "#000000" },
  { name: "Aurora Borealis", c1: "#00ff87", c2: "#60efff", c3: "#7b2cbf" },
  { name: "Cotton Candy", c1: "#ff9ebb", c2: "#a2d2ff", c3: "#cdb4db" }
];

const BORDER_ARCHETYPES = [
  { type: "neon-flow", label: "Neon Flow", cat: "Neon & Cyber" },
  { type: "double-laser", label: "Dual Laser Rail", cat: "Neon & Cyber" },
  { type: "hud-tactical", label: "Tactical HUD Brackets", cat: "Gaming & HUD" },
  { type: "mecha-corners", label: "Mecha Sci-Fi Frame", cat: "Gaming & HUD" },
  { type: "hazard-stripes", label: "Hazard Caution Frame", cat: "Retro & Pattern" },
  { type: "plasma-pulse", label: "Plasma Aura Pulse", cat: "Fire & Elemental" },
  { type: "prism-glass", label: "Crystal Glassmorphic", cat: "Luxury & Glass" },
  { type: "gold-filigree", label: "Prestige Crown Trim", cat: "Luxury & Glass" },
  { type: "glitch-cyber", label: "Glitch Overload", cat: "Neon & Cyber" },
  { type: "retro-arcade", label: "Arcade Pixel Bevel", cat: "Retro & Pattern" }
];

/* NEW in this version - IDs 121-192 */
const BORDER_ARCHETYPES_V2 = [
  { type: "circuit-trace", label: "Circuit Trace Grid", cat: "Gaming & HUD" },
  { type: "aurora-veil", label: "Aurora Veil", cat: "Fire & Elemental" },
  { type: "holo-shard", label: "Holographic Shard", cat: "Luxury & Glass" },
  { type: "vapor-grid", label: "Vaporwave Grid", cat: "Retro & Pattern" },
  { type: "data-stream", label: "Data Stream Rails", cat: "Neon & Cyber" },
  { type: "ember-forge", label: "Ember Forge", cat: "Fire & Elemental" }
];

const ALERT_ARCHETYPES = [
  { type: "capsule-neon", label: "Neon Capsule Pill", cat: "Modern & Pill" },
  { type: "cyber-angled", label: "Cyber Angled Blade", cat: "Cyber & Sci-Fi" },

const PAL_COUNT = BORDER_PALETTES.length;

/* Resolves an ID to either the original 1-120 block or the new 121+ block. */
function splitId(id, legacyCount, extraCount, extraSpread) {
  const n = Math.max(1, parseInt(id, 10) || 1);
  const maxExtra = extraCount * extraSpread;
  if (n > legacyCount && maxExtra > 0) {
    return { legacy: false, idx: Math.min(n - legacyCount - 1, maxExtra - 1) };
  }
  return { legacy: true, idx: Math.min(legacyCount - 1, n - 1) };
}

function getBorderPreset(id) {
  const s = splitId(id, 120, BORDER_ARCHETYPES_V2.length, PAL_COUNT);
  const set = s.legacy ? BORDER_ARCHETYPES : BORDER_ARCHETYPES_V2;
  const arch = set[s.idx % set.length];
  const pal = BORDER_PALETTES[Math.floor(s.idx / set.length) % PAL_COUNT];
  return {
    id: s.legacy ? s.idx + 1 : 121 + s.idx,
    name: pal.name + " " + arch.label,
    category: arch.cat,
    type: arch.type,
    c1: pal.c1,
    c2: pal.c2,
    c3: pal.c3
  };
}

function getAlertPreset(id) {
  const s = splitId(id, 120, ALERT_ARCHETYPES_V2.length, PAL_COUNT);
  const set = s.legacy ? ALERT_ARCHETYPES : ALERT_ARCHETYPES_V2;
  const arch = set[s.idx % set.length];
  const pal = BORDER_PALETTES[Math.floor(s.idx / set.length) % PAL_COUNT];
  return {

    type: arch.type,
    c1: pal.c1,
    c2: pal.c2,
    c3: pal.c3
  };
}

function getInOutPreset(id) {
  const s = splitId(id, 120, INOUT_FAMILIES_V2.length, INOUT_DIRS.length);
  const set = s.legacy ? INOUT_FAMILIES : INOUT_FAMILIES_V2;
  return {
    id: s.legacy ? s.idx + 1 : 121 + s.idx,
    type: set[s.idx % set.length],
    dir: INOUT_DIRS[Math.floor(s.idx / set.length) % INOUT_DIRS.length]

}

function getGlowPreset(id) {

function getAnimPreset(id) {

}

/* ============================================================================
   COLOR RESOLUTION
   ========================================================================== */
function resolveActiveColors(activeData) {
  const preset = getBorderPreset(config.borderId);
  let c1 = preset.c1;
  let c2 = preset.c2;
  let c3 = preset.c3;

  const mode = config.colorMode || (config.useCustomColors ? "custom" : "preset");
  const plat = ((activeData && activeData.platform) || "twitch").toLowerCase();

  if (mode === "custom" || config.useCustomColors) {
    c1 = config.primary || c1;
    c2 = config.secondary || c2;
    c3 = config.accent || c3;
  } else if (mode === "twitch-user") {
    let uCol = (activeData && (activeData.userColor || activeData.color)) || config.twitchUserColor || "#9146FF";
    if (activeData && activeData.username && (!activeData.userColor && !activeData.color) && !config.twitchUserColor) {
      let hash = 0;
      for (let i = 0; i < activeData.username.length; i++) hash = activeData.username.charCodeAt(i) + ((hash << 5) - hash);
      uCol = TWITCH_CHAT_PALETTE[Math.abs(hash) % TWITCH_CHAT_PALETTE.length];
    }
    c1 = uCol;
    c2 = "#00f0ff";
    c3 = "#ffffff";
  } else if (mode === "platform-auto") {
    if (plat.includes("youtube")) {
      c1 = "#ff0033"; c2 = "#ff6666"; c3 = "#ffffff";
    } else if (plat.includes("kick")) {
      c1 = "#53fc18"; c2 = "#00e701"; c3 = "#111111";
    } else {
      c1 = "#9146ff"; c2 = "#00f0ff"; c3 = "#ff007f";
    }
  } else if (mode === "twitch-purple") {
    c1 = "#9146ff"; c2 = "#00f0ff"; c3 = "#b983ff";
  } else if (mode === "youtube-red") {
    c1 = "#ff0033"; c2 = "#ff6666"; c3 = "#ffffff";
  } else if (mode === "kick-green") {
    c1 = "#53fc18"; c2 = "#00e701"; c3 = "#ffffff";
  }

  return { c1, c2, c3 };
}

/* ============================================================================
   IN / OUT TRANSITIONS
   ========================================================================== */
function applyInOutEffects(inOutId) {
  const fx = getInOutPreset(inOutId);
  const root = document.documentElement;

  let dx = "0px", dy = "35px";
  if (fx.dir === "down") dy = "-45px";
  else if (fx.dir === "left") { dx = "-65px"; dy = "0px"; }
  else if (fx.dir === "right") { dx = "65px"; dy = "0px"; }
  else if (fx.dir === "diag-tl") { dx = "-45px"; dy = "-45px"; }
  else if (fx.dir === "diag-br") { dx = "45px"; dy = "45px"; }

  let inTransform = `scale(0.78) translate(${dx}, ${dy})`;
  let outTransform = `scale(0.84) translate(${dx}, calc(${dy} * -0.8))`;
  let inFilter = "blur(0px)";
  let outFilter = "blur(0px)";
  let ease = "cubic-bezier(0.16, 1, 0.3, 1)";
  let dur = "0.48s";

  switch (fx.type) {
    case "elastic-pop":
      ease = "cubic-bezier(0.34, 1.56, 0.64, 1)";
      inTransform = `scale(0.45) translate(${dx}, ${dy})`;
      break;
    case "cyber-glitch":
      inTransform = `scale(1.08) skewX(18deg) translate(${dx}, ${dy})`;
      outTransform = `scale(0.9) skewX(-18deg) translate(${dx}, ${dy})`;
      inFilter = "hue-rotate(90deg) blur(4px)";
      outFilter = "hue-rotate(-90deg) blur(4px)";
      break;
    case "flip-3d-x":
      inTransform = `perspective(900px) rotateX(75deg) translate(${dx}, ${dy})`;
      outTransform = `perspective(900px) rotateX(-65deg) scale(0.88)`;
      break;
    case "flip-3d-y":
      inTransform = `perspective(900px) rotateY(75deg) translate(${dx}, ${dy})`;
      outTransform = `perspective(900px) rotateY(-65deg) scale(0.88)`;
      break;
    case "slide-skew":
      inTransform = `translate(${dx}, ${dy}) skewX(-16deg) scale(0.92)`;
      outTransform = `translate(calc(${dx} * -1), ${dy}) skewX(16deg) scale(0.92)`;
      break;
    case "whip-pan":
      dur = "0.36s";
      inTransform = `translate(${dx}, ${dy}) scaleX(1.25)`;
      inFilter = "blur(8px)";
      outFilter = "blur(8px)";
      break;
    case "drop-bounce":

    case "spiral-spin":

    case "blur-drift":

      outTransform = `scaleY(0.03) skewX(-10deg)`;

    case "rubber-stretch":
      ease = "cubic-bezier(0.2, 1.7, 0.4, 1)";
      dur = "0.56s";

      outTransform = `scale(0.6, 1.28)`;
      break;
    case "neon-flicker":
      dur = "0.44s";
      inTransform = `scale(0.97) translate(${dx}, calc(${dy} * 0.4))`;
      outTransform = `scale(1.02)`;
      inFilter = "brightness(3.2) saturate(0.25)";
      outFilter = "brightness(0.12)";
      break;
    case "card-deal":
      ease = "cubic-bezier(0.2, 1.3, 0.4, 1)";
      inTransform = `translate(${dx}, ${dy}) rotate(${fx.dir === "twist-ccw" ? "-16deg" : "16deg"}) scale(0.84)`;
      outTransform = `translate(calc(${dx} * -1), calc(${dy} * -1)) rotate(${fx.dir === "twist-ccw" ? "12deg" : "-12deg"}) scale(0.86)`;
      break;
    case "warp-tunnel":

      outTransform = `perspective(700px) translateZ(360px) scale(1.5)`;
      inFilter = "blur(11px)";
      outFilter = "blur(13px)";
      break;
  }

  root.style.setProperty("--fx-in-transform", inTransform);
  root.style.setProperty("--fx-out-transform", outTransform);
  root.style.setProperty("--fx-in-filter", inFilter);
  root.style.setProperty("--fx-out-filter", outFilter);
  root.style.setProperty("--fx-ease", ease);
  root.style.setProperty("--fx-dur", dur);

/* Automatically shrinks font size slightly if a username or game name is extra
   long so it never cuts off */
function fitOverlayText() {
  const alertUser = document.getElementById("alert-username");
  const bannerName = document.getElementById("banner-name");
  const bannerGame = document.getElementById("banner-game");

  const baseUserSize = Number(config.usernameSize) || 40;
  const baseGameSize = Number(config.gameSize) || 14;

  if (alertUser) {
    const len = (alertUser.textContent || "").length;
    const scale = len > 26 ? Math.max(0.55, 24 / len) : (len > 18 ? 0.78 : 1);
    alertUser.style.fontSize = Math.round(baseUserSize * scale) + "px";
  }

  if (bannerName && bannerGame) {
    const totalChars = (bannerName.textContent || "").length + (bannerGame.textContent || "").length;
    const scale = totalChars > 42 ? Math.max(0.62, 38 / totalChars) : (totalChars > 28 ? 0.82 : 1);
    bannerName.style.fontSize = Math.round(baseUserSize * 0.52 * scale) + "px";
    bannerGame.style.fontSize = Math.round(baseGameSize * scale) + "px";
  }
}

// TWITCH PERSISTED GQL RESOLVER (Unlocks direct .mp4 URL from clipSlug)
// ============================================================================
async function resolveClipMp4InBrowser(slug) {
  if (!slug) return "";
  try {
    const gqlPayload = [{
      operationName: "VideoAccessToken_Clip",
      variables: { slug: slug },
      extensions: {
        persistedQuery: {
          version: 1,
          sha256Hash: "36b89d2507fce29e5ca551df756d27c1cfe079e2609642b4390aa4c35796eb11"
        }
      }
    }];

    const res = await fetch("https://gql.twitch.tv/gql", {
      method: "POST",
      headers: {
        "Client-Id": "kimne78kx3ncx6brgo4mv6wki5h1ko",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(gqlPayload)
    });

    const json = await res.json();
    const root = Array.isArray(json) ? json[0] : json;
    const clip = root && root.data && root.data.clip;
    if (!clip) return "";

    const qualities = clip.videoQualities;
    const sig = clip.playbackAccessToken && clip.playbackAccessToken.signature;
    const token = clip.playbackAccessToken && clip.playbackAccessToken.value;

    if (qualities && qualities.length > 0 && sig && token) {
      return `${qualities[0].sourceURL}?sig=${sig}&token=${encodeURIComponent(token)}`;
    }
  } catch (err) {
    console.warn("Twitch GQL clip resolver error:", err);
  }
  return "";
}

// ============================================================================
// KICK SUPPORT: CLIP LOOKUP + HLS PLAYBACK
// Kick has no official "list a channel's clips" API yet, so this asks the same
// endpoint kick.com's own website uses. Kick clips are HLS playlists (.m3u8),
// so they are played through hls.js, which is only downloaded when needed.
// ============================================================================
const HLS_JS_URL = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.20/hls.min.js";
let hlsLoadPromise = null;
let hlsInstance = null;

function kickSlug(name) {
  // Kick channel URLs are the username lowercased with "_" swapped for "-"
  return String(name || "").trim().replace(/^@/, "").toLowerCase().replace(/\s+/g, "").replace(/_/g, "-");
}

function platformKey(data) {
  const p = String((data && data.platform) || "twitch").toLowerCase();
  if (p.includes("kick")) return "kick";
  if (p.includes("youtube")) return "youtube";
  return "twitch";
}

function platformName(data) {
  const k = platformKey(data);
  return k === "kick" ? "Kick" : (k === "youtube" ? "YouTube" : "Twitch");
}

function channelLabel(data) {
  const k = platformKey(data);
  const login = (data && (data.login || data.username)) || "";
  if (k === "kick") return `kick.com/${kickSlug((data && data.slug) || login)}`;
  if (k === "youtube") return `youtube.com/@${login}`;
  return `twitch.tv/${login}`;
}

function defaultAvatar(data) {
  const k = platformKey(data);
  const name = (data && (data.slug || data.login || data.username)) || "streamer";
  if (k === "kick") return `https://unavatar.io/kick/${encodeURIComponent(kickSlug(name))}`;
  if (k === "youtube") return `https://unavatar.io/youtube/${encodeURIComponent(name)}`;
  return `https://unavatar.io/twitch/${encodeURIComponent(name)}`;
}

function isHlsUrl(url) {
  return /\.m3u8(\?|#|$)/i.test(String(url || ""));
}

function pickKickPlayable(clip) {
  const candidates = [clip && clip.video_url, clip && clip.clip_url, clip && clip.playback_url, clip && clip.url];
  for (const c of candidates) {
    if (typeof c === "string" && /^https?:\/\//i.test(c) && /\.(m3u8|mp4)(\?|#|$)/i.test(c)) return c;
  }
  return "";
}

// Pulls the most recent playable clip out of whatever shape Kick's response has
function pickLatestKickClip(json) {
  let list = [];
  if (Array.isArray(json)) list = json;
  else if (json && Array.isArray(json.clips)) list = json.clips;
  else if (json && json.data && Array.isArray(json.data.clips)) list = json.data.clips;
  else if (json && Array.isArray(json.data)) list = json.data;

  let best = null;
  let bestTime = -Infinity;
  for (const clip of list) {
    const url = pickKickPlayable(clip);
    if (!url) continue;
    const t = Date.parse(clip.created_at || clip.createdAt || "") || 0;
    if (!best || t >= bestTime) {
      best = { clip, url };
      bestTime = t;
    }
  }
  if (!best) return null;

  const ch = best.clip.channel || {};
  return {
    url: best.url,
    duration: Math.ceil(Number(best.clip.duration) || 0),
    title: best.clip.title || "",
    avatar: ch.profile_picture || ch.profile_pic || ""
  };
}

async function resolveKickClip(name) {
  const slug = kickSlug(name);
  if (!slug) return null;

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(slug)}/clips?sort=date&time=all`, {
      headers: { "Accept": "application/json" },
      signal: ctrl.signal
    });
    if (!res.ok) {
      console.warn(`[Shoutout] Kick clip lookup for "${slug}" failed with HTTP ${res.status}` +
        (res.status === 403 ? " (Cloudflare is blocking the request)" : ""));
      return null;
    }
    const found = pickLatestKickClip(await res.json());
    if (!found) console.info(`[Shoutout] Kick channel "${slug}" has no playable clips.`);
    return found;
  } catch (err) {
    console.warn(`[Shoutout] Kick clip lookup for "${slug}" failed: ${err && err.message}. ` +
      `"Failed to fetch" usually means the browser blocked the request (CORS / Cloudflare).`);
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function loadHlsJs() {
  if (window.Hls) return Promise.resolve(window.Hls);
  if (!hlsLoadPromise) {
    hlsLoadPromise = new Promise((resolve, reject) => {
      const el = document.createElement("script");
      el.src = HLS_JS_URL;
      el.onload = () => (window.Hls ? resolve(window.Hls) : reject(new Error("hls.js loaded but Hls is missing")));
      el.onerror = () => { hlsLoadPromise = null; reject(new Error("hls.js could not be downloaded")); };
      document.head.appendChild(el);
    });
  }
  return hlsLoadPromise;
}

function destroyHls() {
  if (hlsInstance) {
    try { hlsInstance.destroy(); } catch (e) {}
    hlsInstance = null;
  }
}

// Resolves true once the source is wired to the <video>, false if it can't be played here.
async function attachClipSource(videoEl, url, onFatal) {
  destroyHls();
  if (!isHlsUrl(url)) {
    videoEl.src = url;
    return true;
  }

  try {
    const Hls = await Promise.race([
      loadHlsJs(),
      new Promise((_, reject) => setTimeout(() => reject(new Error("hls.js load timed out")), 8000))
    ]);
    if (Hls.isSupported()) {
      hlsInstance = new Hls({ enableWorker: true });
      hlsInstance.on(Hls.Events.ERROR, (_evt, d) => { if (d && d.fatal) onFatal(d); });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoEl);
      return true;
    }
  } catch (err) {
    console.warn("[Shoutout] hls.js unavailable:", err && err.message);
  }

  // Last resort: browsers with built-in HLS (Safari etc.)
  if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
    videoEl.src = url;
    return true;
  }
  return false;
}

// ============================================================================
// SHOUTOUT SEQUENCER: PHASE 1 (ALERT) -> PHASE 2 (BORDER + CLIP)
// ============================================================================
let activeTimeouts = [];
let isPlaying = false;
let queue = [];

function clearTimers() {
  activeTimeouts.forEach(t => clearTimeout(t));
  activeTimeouts = [];
}

function enqueueShoutout(data) {
  queue.push(data);
  if (!isPlaying) processNextShoutout();
}

function processNextShoutout() {
  if (queue.length === 0) {
    isPlaying = false;
    return;
  }
  isPlaying = true;
  const data = queue.shift();
  runShoutoutSequence(data);
}

function runShoutoutSequence(data) {
  clearTimers();
  lastTriggerData = data;
  applyConfigToDOM(data);

  const alertEl = document.getElementById("alert-container");
  const clipWrap = document.getElementById("clip-wrapper");
  const videoEl = document.getElementById("clip-video");
  const fallbackEl = document.getElementById("no-clip-fallback");
  const alertProg = document.getElementById("alert-progress");

  // Reset states
  alertEl.classList.remove("active", "exit");
  clipWrap.classList.remove("active", "exit");
  videoEl.pause();
  destroyHls();
  videoEl.removeAttribute("src");
  fallbackEl.style.display = "none";
  videoEl.style.display = "block";

  const username = data.username || "Streamer";
  const avatar = data.avatar || defaultAvatar(data);
  const platform = (data.platform || "twitch").toLowerCase();

  // Pre-resolve the clip (Twitch MP4 or Kick HLS) while the alert is showing!
  data._resolvedMp4Promise = (async () => {
    if (data.clipUrl && data.clipUrl.startsWith("http")) return data.clipUrl;

    if (platformKey(data) === "kick") {
      const found = await resolveKickClip(data.slug || data.login || data.username);
      if (!found) return "";
      if (found.duration) data.clipDuration = found.duration;
      // Kick's own profile picture beats the generic avatar service
      if (found.avatar && lastTriggerData === data && (!data.avatar || /unavatar\.io/i.test(data.avatar))) {
        ["alert-avatar", "banner-avatar", "fallback-avatar"].forEach(id => {
          document.getElementById(id).src = found.avatar;
        });
      }
      return found.url;
    }

    if (data.clipSlug) return await resolveClipMp4InBrowser(data.clipSlug);
    return "";
  })();

  document.getElementById("alert-avatar").src = avatar;
  document.getElementById("banner-avatar").src = avatar;
  document.getElementById("fallback-avatar").src = avatar;
  document.getElementById("alert-username").textContent = username;
  document.getElementById("banner-name").textContent = username;
  document.getElementById("fallback-title").textContent = username;

  const subText = data.game ? `Last playing: ${data.game}` : (config.alertSubtext || "Check out their stream!");
  document.getElementById("alert-sub").textContent = subText;

  // Never show data.clipTitle on the banner; only show game or fallback text
  const bannerGameEl = document.getElementById("banner-game");
  bannerGameEl.textContent = data.game || "Featured Streamer";

  fitOverlayText();

  const platBadge = document.getElementById("alert-platform");
  platBadge.className = "platform-badge";
  if (platform.includes("kick")) {
    platBadge.classList.add("platform-kick");
    platBadge.textContent = "K";
  } else if (platform.includes("youtube")) {
    platBadge.classList.add("platform-youtube");
    platBadge.textContent = "YT";
  } else {
    platBadge.classList.add("platform-twitch");
    platBadge.textContent = "TW";
  }

  // ---------------- PHASE 1: SHOW ALERT FIRST ----------------
  const alertMs = Math.max(1, Number(config.alertDuration) || 10) * 1000;
  alertProg.style.animation = "none";
  void alertProg.offsetWidth;
  alertProg.style.animation = `countdownLinear ${alertMs}ms linear forwards`;

  requestAnimationFrame(() => {
    alertEl.classList.add("active");
  });

  // Hide Alert after alertDuration, then start Phase 2
  activeTimeouts.push(setTimeout(() => {
    alertEl.classList.remove("active");
    alertEl.classList.add("exit");

    activeTimeouts.push(setTimeout(() => {
      alertEl.classList.remove("exit");
      startClipPhase(data);
    }, 450));
  }, alertMs));
}

async function startClipPhase(data) {
  const clipWrap = document.getElementById("clip-wrapper");
  const videoEl = document.getElementById("clip-video");
  const fallbackEl = document.getElementById("no-clip-fallback");
  const clipProg = document.getElementById("clip-timer-bar");

  let mp4Url = "";
  if (data._resolvedMp4Promise) {
    mp4Url = await data._resolvedMp4Promise;
  }

  const maxClipSec = Math.max(3, Number(config.clipDuration) || 30);
  const actualClipSec = data.clipDuration ? Math.min(maxClipSec, Number(data.clipDuration)) : maxClipSec;
  // HLS needs a moment to start; give clips that fit inside the limit a little slack (onended still ends them early)
  const hlsSlack = (isHlsUrl(mp4Url) && actualClipSec < maxClipSec) ? 2 : 0;
  const playMs = (mp4Url ? actualClipSec + hlsSlack : 8) * 1000;

  clipProg.style.animation = "none";
  void clipProg.offsetWidth;
  clipProg.style.animation = `countdownLinear ${playMs}ms linear forwards`;

  clipWrap.classList.add("active");

  let finished = false;
  const finishClip = () => {
    if (finished) return;
    finished = true;
    clipWrap.classList.remove("active");
    clipWrap.classList.add("exit");
    videoEl.pause();

    activeTimeouts.push(setTimeout(() => {
      clipWrap.classList.remove("exit");
      destroyHls();
      videoEl.removeAttribute("src");
      processNextShoutout();
    }, 500));
  };

  if (mp4Url) {
    fallbackEl.style.display = "none";
    videoEl.style.display = "block";
    videoEl.muted = false;
    videoEl.volume = Math.max(0, Math.min(1, (Number(config.volume) || 80) / 100));
    videoEl.onended = finishClip;

    // Show channel card inside the border if the video stream errors
    const showChannelCard = () => {
      videoEl.style.display = "none";
      fallbackEl.style.display = "flex";
      document.getElementById("fallback-msg").textContent = data.game ? `Streaming ${data.game}` : channelLabel(data);
    };
    videoEl.onerror = showChannelCard;

    const startPlayback = () => {
      videoEl.play().catch(() => {
        // Fallback to muted autoplay if OBS/browser blocks unmuted audio
        videoEl.muted = true;
        videoEl.play().catch(finishClip);
      });
    };

    if (isHlsUrl(mp4Url)) {
      attachClipSource(videoEl, mp4Url, showChannelCard).then(ok => {
        if (finished) { destroyHls(); return; }
        if (ok) startPlayback(); else showChannelCard();
      });
    } else {
      videoEl.src = mp4Url;
      startPlayback();
    }
  } else {
    // User has 0 clips on this platform: still show the Custom Border with their channel card
    videoEl.style.display = "none";
    fallbackEl.style.display = "flex";
    document.getElementById("fallback-msg").textContent = data.game
      ? `Last seen playing ${data.game} (No Clips Found)`
      : `No ${platformName(data)} clips found for ${data.username}`;
  }

  activeTimeouts.push(setTimeout(finishClip, playMs));
}

// ============================================================================
// STREAMER.BOT WEBSOCKET CLIENT
// ============================================================================
let ws = null;
function connectStreamerBot() {
  const url = `ws://${config.wsHost}:${config.wsPort}/`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      request: "Subscribe",
      id: "custom-shoutout-overlay-sub",
      events: {
        General: ["Custom"]
      }
    }));
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      const payload = msg.data || msg;

      if (payload && payload.event === "CustomShoutoutConfigUpdate" && payload.config) {
        Object.assign(config, payload.config);
        localStorage.setItem("sb_shoutout_config_v1", JSON.stringify(config));
        applyConfigToDOM();
      }

      if (payload && payload.event === "CustomShoutoutTrigger") {
        enqueueShoutout(payload);
      }
    } catch (e) {}
  };

  ws.onclose = () => {
    setTimeout(connectStreamerBot, 3000);
  };
}

window.addEventListener("storage", (e) => {
  if (e.key === "sb_shoutout_config_v1" && e.newValue) {
    try {
      Object.assign(config, JSON.parse(e.newValue));
      applyConfigToDOM();
    } catch (err) {}
  }
});

/* ----------------------------------------------------------------------------
   CUSTOMIZER BRIDGE
   Lets customizer.html drive this page live, both when it can reach the iframe
   directly and when the browser sandboxes file:// frames (postMessage fallback).
   This has nothing to do with Streamer.bot and never runs in OBS.
---------------------------------------------------------------------------- */
window.config = config;
window.applyConfigToDOM = applyConfigToDOM;
window.enqueueShoutout = enqueueShoutout;
window.ShoutoutOverlay = {
  get config() { return config; },
  applyConfig: function (partial) {
    if (partial) Object.assign(config, partial);
    applyConfigToDOM();
  },
  test: enqueueShoutout,
  version: "2.0"
};

window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || typeof m !== "object") return;
  if (m.type === "shoutout:config" && m.config) {
    Object.assign(config, m.config);
    applyConfigToDOM();
  } else if (m.type === "shoutout:test" && m.data) {
    enqueueShoutout(m.data);
  }
});

loadConfig();
connectStreamerBot();
</script>
